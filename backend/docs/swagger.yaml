basePath: /api/v1
definitions:
  dto.CreateCartItemDTO:
    properties:
      product_id:
        type: integer
    required:
    - product_id
    type: object
  dto.CreateCategoryDTO:
    properties:
      category_name:
        maxLength: 50
        minLength: 5
        type: string
      category_slug:
        maxLength: 60
        minLength: 5
        type: string
    required:
    - category_name
    - category_slug
    type: object
  dto.CreateUserDTO:
    properties:
      email:
        type: string
      password:
        maxLength: 60
        minLength: 8
        type: string
      username:
        maxLength: 40
        minLength: 3
        type: string
    required:
    - email
    - password
    - username
    type: object
  dto.GetCartItemDTO:
    properties:
      cart_id:
        type: integer
      cart_item_id:
        type: integer
      product:
        $ref: '#/definitions/dto.GetProductDTO'
      quantity:
        type: integer
    type: object
  dto.GetCategoryDTO:
    properties:
      category_id:
        type: integer
      category_name:
        type: string
      category_slug:
        type: string
    type: object
  dto.GetOrderDTO:
    properties:
      order_id:
        type: integer
      order_items:
        items:
          $ref: '#/definitions/dto.GetOrderItemDTO'
        type: array
      order_status:
        type: string
      order_total:
        type: number
      user_id:
        type: integer
    type: object
  dto.GetOrderItemDTO:
    properties:
      order_item_id:
        type: integer
      order_item_quantity:
        type: integer
      order_item_total:
        type: number
      product:
        $ref: '#/definitions/dto.GetProductDTO'
    type: object
  dto.GetProductDTO:
    properties:
      category:
        $ref: '#/definitions/dto.GetCategoryDTO'
      product_description:
        type: string
      product_id:
        type: integer
      product_image:
        type: string
      product_name:
        type: string
      product_price:
        type: number
      seller_id:
        type: integer
    type: object
  dto.LoginDTO:
    properties:
      password:
        maxLength: 60
        minLength: 8
        type: string
      username:
        maxLength: 40
        minLength: 3
        type: string
    required:
    - password
    - username
    type: object
  dto.UserRoleDTO:
    properties:
      role:
        type: string
      username:
        type: string
    required:
    - role
    - username
    type: object
  handler.AuthResponse:
    properties:
      access_token:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
      roles:
        example:
        - user
        - seller
        items:
          type: string
        type: array
    type: object
  handler.CartItemIDResponse:
    properties:
      cart_item_id:
        example: 33
        type: integer
    type: object
  handler.CategoryIDResponse:
    properties:
      category_id:
        example: 7
        type: integer
    type: object
  handler.ErrorResponse:
    properties:
      message:
        example: validation failed
        type: string
    type: object
  handler.MessageResponse:
    properties:
      message:
        example: operation successful
        type: string
    type: object
  handler.OrderIDResponse:
    properties:
      order_id:
        example: 101
        type: integer
    type: object
  handler.ProductIDResponse:
    properties:
      product_id:
        example: 15
        type: integer
    type: object
  handler.ProductListResponse:
    properties:
      limit:
        example: 20
        type: integer
      page:
        example: 1
        type: integer
      products:
        items:
          $ref: '#/definitions/dto.GetProductDTO'
        type: array
    type: object
  handler.QuantityResponse:
    properties:
      quantity:
        example: 3
        type: integer
    type: object
  handler.StatusResponse:
    properties:
      status:
        example: ok
        type: string
    type: object
  handler.UserIDResponse:
    properties:
      user_id:
        example: 42
        type: integer
    type: object
host: localhost:8080
info:
  contact:
    email: support@example.com
    name: API Support
  description: 'REST API for marketplace: products, categories, cart, orders, auth
    and roles.'
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: Marketplace API
  version: "1.0"
paths:
  /cart:
    get:
      description: Get all items in the authenticated user's cart.
      produces:
      - application/json
      responses:
        "200":
          description: List of cart items
          schema:
            items:
              $ref: '#/definitions/dto.GetCartItemDTO'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List cart items
      tags:
      - Cart
  /cart/items:
    post:
      consumes:
      - application/json
      description: Add a product to the authenticated user's cart.
      parameters:
      - description: Product to add
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.CreateCartItemDTO'
      produces:
      - application/json
      responses:
        "200":
          description: Created cart item ID
          schema:
            $ref: '#/definitions/handler.CartItemIDResponse'
        "400":
          description: Parse or validation error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: Product not found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Add item to cart
      tags:
      - Cart
  /cart/items/{cart_item_id}:
    delete:
      description: Delete a cart item by ID.
      parameters:
      - description: Cart item ID
        in: path
        name: cart_item_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Deletion confirmation
          schema:
            $ref: '#/definitions/handler.MessageResponse'
        "400":
          description: Invalid cart_item_id
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: Cart item not found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Remove item from cart
      tags:
      - Cart
    patch:
      description: Change quantity of a cart item by delta (can be negative).
      parameters:
      - description: Cart item ID
        in: path
        name: cart_item_id
        required: true
        type: integer
      - description: Quantity change (positive or negative)
        in: query
        name: delta
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Updated quantity
          schema:
            $ref: '#/definitions/handler.QuantityResponse'
        "400":
          description: Invalid parameters
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: Cart item not found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update cart item quantity
      tags:
      - Cart
  /categories:
    get:
      description: Get all product categories.
      produces:
      - application/json
      responses:
        "200":
          description: List of categories
          schema:
            items:
              $ref: '#/definitions/dto.GetCategoryDTO'
            type: array
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: List categories
      tags:
      - Categories
    post:
      consumes:
      - application/json
      description: Create a new product category. Requires admin role.
      parameters:
      - description: Category data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.CreateCategoryDTO'
      produces:
      - application/json
      responses:
        "200":
          description: Created category ID
          schema:
            $ref: '#/definitions/handler.CategoryIDResponse'
        "400":
          description: Parse or validation error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "403":
          description: Forbidden (not admin)
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "409":
          description: Category name or slug already exists
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create category
      tags:
      - Categories
  /health:
    get:
      description: Check availability of database and Redis.
      produces:
      - application/json
      responses:
        "200":
          description: Service is healthy
          schema:
            $ref: '#/definitions/handler.StatusResponse'
        "503":
          description: Service is unhealthy
          schema:
            $ref: '#/definitions/handler.StatusResponse'
      summary: Health check
      tags:
      - Health
  /login:
    post:
      consumes:
      - application/json
      description: 'Authenticate user by username and password. Returns access token
        and sets refresh token cookie. Rate limit: 5 req/min.'
      parameters:
      - description: Login credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.LoginDTO'
      produces:
      - application/json
      responses:
        "200":
          description: Access token and user roles
          schema:
            $ref: '#/definitions/handler.AuthResponse'
        "400":
          description: Parse or validation error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Invalid credentials
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "429":
          description: Too many requests
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Login
      tags:
      - Auth
  /logout:
    post:
      description: Invalidate refresh and access tokens. Requires valid access token.
        Clears refresh token cookie.
      produces:
      - application/json
      responses:
        "200":
          description: Logout confirmation
          schema:
            $ref: '#/definitions/handler.MessageResponse'
        "401":
          description: Unauthorized or missing refresh token
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Logout
      tags:
      - Auth
  /orders:
    get:
      description: Get all orders of the authenticated user.
      produces:
      - application/json
      responses:
        "200":
          description: List of user orders
          schema:
            items:
              $ref: '#/definitions/dto.GetOrderDTO'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List user orders
      tags:
      - Orders
    post:
      description: 'Create an order from the current cart contents. Rate limit: 2
        req/min.'
      produces:
      - application/json
      responses:
        "200":
          description: Created order ID
          schema:
            $ref: '#/definitions/handler.OrderIDResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "429":
          description: Too many requests
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create order
      tags:
      - Orders
  /products:
    get:
      description: Public product listing with search, category filter, sorting and
        pagination.
      parameters:
      - description: Page number (starting from 1)
        in: query
        name: page
        required: true
        type: integer
      - description: Search by product name
        in: query
        name: search
        type: string
      - description: Filter by category slug
        in: query
        name: category
        type: string
      - description: Sort field (e.g. price, name)
        in: query
        name: sortBy
        type: string
      - description: Ascending order (default false)
        in: query
        name: asc
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: Paginated list of products
          schema:
            $ref: '#/definitions/handler.ProductListResponse'
        "400":
          description: Invalid page parameter
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: List products
      tags:
      - Products
  /refresh:
    post:
      description: 'Refresh access token using refresh token from cookie. Rate limit:
        3 req/min.'
      produces:
      - application/json
      responses:
        "200":
          description: New access token and user roles
          schema:
            $ref: '#/definitions/handler.AuthResponse'
        "401":
          description: Missing or invalid refresh token
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "429":
          description: Too many requests
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Refresh tokens
      tags:
      - Auth
  /roles:
    post:
      consumes:
      - application/json
      description: Assign a role to a user. Requires admin role.
      parameters:
      - description: Username and role
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.UserRoleDTO'
      produces:
      - application/json
      responses:
        "200":
          description: Role granted confirmation
          schema:
            $ref: '#/definitions/handler.MessageResponse'
        "400":
          description: Parse or validation error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "403":
          description: Forbidden (not admin)
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: User not found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Grant role
      tags:
      - Roles
  /roles/{username}:
    get:
      description: Get all roles of a user by username. Requires admin role.
      parameters:
      - description: Username
        in: path
        name: username
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: List of roles
          schema:
            items:
              type: string
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: User not found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List user roles
      tags:
      - Roles
  /roles/user/{username}/role/{rolename}:
    delete:
      description: Remove a role from a user. Requires admin role.
      parameters:
      - description: Username
        in: path
        name: username
        required: true
        type: string
      - description: Role name
        in: path
        name: rolename
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Role revoked confirmation
          schema:
            $ref: '#/definitions/handler.MessageResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: User or role not found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Revoke role
      tags:
      - Roles
  /seller/products:
    get:
      description: List products belonging to the authenticated seller. Requires seller
        or admin role.
      parameters:
      - description: Page number
        in: query
        name: page
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Paginated list of seller products
          schema:
            $ref: '#/definitions/handler.ProductListResponse'
        "400":
          description: Invalid page
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List seller products
      tags:
      - SellerProducts
    post:
      consumes:
      - multipart/form-data
      description: 'Create a new product with image upload. Requires seller or admin
        role. Rate limit: 5 req/hour. Content-Type: multipart/form-data.'
      parameters:
      - description: Product name
        in: formData
        name: product_name
        required: true
        type: string
      - description: Product description
        in: formData
        name: product_description
        required: true
        type: string
      - description: Product price (decimal)
        in: formData
        name: product_price
        required: true
        type: string
      - description: Category slug
        in: formData
        name: category_slug
        required: true
        type: string
      - description: Product image (image/*)
        in: formData
        name: product_image
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: Created product ID
          schema:
            $ref: '#/definitions/handler.ProductIDResponse'
        "400":
          description: Parse, validation or missing file error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "429":
          description: Too many requests
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create product
      tags:
      - SellerProducts
  /seller/products/{product_id}:
    delete:
      description: Delete product by ID. Seller can delete own products, admin can
        delete any. Requires seller or admin role.
      parameters:
      - description: Product ID
        in: path
        name: product_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Deletion confirmation
          schema:
            $ref: '#/definitions/handler.MessageResponse'
        "400":
          description: Invalid product_id
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: Product not found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete product
      tags:
      - SellerProducts
    put:
      consumes:
      - multipart/form-data
      description: 'Update existing product. Image is optional. Requires seller or
        admin role. Content-Type: multipart/form-data.'
      parameters:
      - description: Product ID
        in: path
        name: product_id
        required: true
        type: integer
      - description: Product name
        in: formData
        name: product_name
        required: true
        type: string
      - description: Product description
        in: formData
        name: product_description
        required: true
        type: string
      - description: Product price (decimal)
        in: formData
        name: product_price
        required: true
        type: string
      - description: Category slug
        in: formData
        name: category_slug
        required: true
        type: string
      - description: New product image (optional)
        in: formData
        name: product_image
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: Updated product ID
          schema:
            $ref: '#/definitions/handler.ProductIDResponse'
        "400":
          description: Parse or validation error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: Product not found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update product
      tags:
      - SellerProducts
  /users:
    post:
      consumes:
      - application/json
      description: 'Create a new user account. Rate limit: 5 req/hour.'
      parameters:
      - description: User registration data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.CreateUserDTO'
      produces:
      - application/json
      responses:
        "200":
          description: Created user ID
          schema:
            $ref: '#/definitions/handler.UserIDResponse'
        "400":
          description: Parse or validation error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "409":
          description: Username or email already exists
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "429":
          description: Too many requests
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Register user
      tags:
      - Users
securityDefinitions:
  BearerAuth:
    description: 'JWT access token. Example: "Bearer {token}"'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
